# GitHub Pages (Jekyll) settings for the docs site.
# Every markdown page in docs/ renders with the HUD layout in _layouts/default.html.
# Built and deployed by .github/workflows/pages.yml.

title: EDGEdir
url: https://edgemodders.github.io
baseurl: /EDGEdir
repo: https://github.com/Edgemodders/EDGEdir

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Status bar links, in order.
nav:
  - title: Docs
    url: /
  - title: Design
    url: /design.html
  - title: D1 Timeline
    url: /d1-timeline.html
  - title: D2 Cast and clips
    url: /d2-cast-and-clips.html
  - title: D3 Preview
    url: /d3-preview.html
  - title: D4 Transitions
    url: /d4-transitions.html
  - title: D5 Play in game
    url: /d5-play-in-game.html
  - title: D6 Audio, camera, weather
    url: /d6-audio-camera-weather.html
  - title: Extension API
    url: /api.html
  - title: Tests
    url: /testing.html
  - title: Dev setup
    url: /dev-setup.html
  - title: Changelog
    url: /changelog.html
